<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huertas · EcoHuertos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-pagina="huertas">

    <header class="topbar">
        <a href="index.html" class="marca">
            <span class="marca-icono">🌿</span>
            <span class="marca-texto">EcoHuertos</span>
        </a>

        <div class="auth-invitado" id="auth-invitado">
            <button class="btn btn-fantasma" id="btn-abrir-login">Iniciar sesión</button>
            <button class="btn btn-relleno" id="btn-abrir-registro">Registrarse</button>
        </div>

        <div class="auth-usuario oculto" id="auth-usuario">
            <span class="saludo">Hola, <strong id="nombre-usuario">vecina</strong></span>
            <button class="btn btn-fantasma" id="btn-salir">Cerrar sesión</button>
        </div>
    </header>

    <main>
        <section class="vista vista-activa">
            <h2>Huertas públicas</h2>
            <p class="subtitulo">Explora las huertas registradas por la comunidad o añade la tuya.</p>

            <form id="form-huerta">
                <div class="campo">
                    <label for="nombre">Nombre de la huerta</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="campo">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" id="ubicacion" required>
                </div>
                <div class="campo">
                    <label for="cultivo">Cultivo principal</label>
                    <input type="text" id="cultivo" required>
                </div>
                <button type="submit" class="btn btn-relleno">Registrar huerta</button>
            </form>

            <div id="contenedor-huertas" class="lista-huertas"></div>
        </section>
    </main>

    <nav class="tabbar">
        <a class="tab" href="index.html">
            <span class="tab-icono">🏠</span><span>Inicio</span>
        </a>
        <a class="tab" href="calendario.html">
            <span class="tab-icono">📅</span><span>Calendario</span>
        </a>
        <a class="tab tab-activa" href="huertas.html" aria-current="page">
            <span class="tab-icono">🌱</span><span>Huertas</span>
        </a>
        <a class="tab" href="foro.html">
            <span class="tab-icono">💬</span><span>Foro</span>
        </a>
        <a class="tab" href="nosotros.html">
            <span class="tab-icono">🌻</span><span>Nosotros</span>
        </a>
        <a class="tab oculto" href="mi-proyecto.html" id="tab-proyecto">
            <span class="tab-icono">📁</span><span>Mi Proyecto</span>
        </a>
    </nav>

    <div class="modal-fondo oculto" id="modal-login">
        <div class="modal">
            <button class="modal-cerrar" data-cerrar="modal-login">✕</button>
            <h2>Iniciar sesión</h2>
            <form id="form-login">
                <div class="campo">
                    <label for="login-identificador">Usuario o correo</label>
                    <input type="text" id="login-identificador" required>
                </div>
                <div class="campo">
                    <label for="login-clave">Contraseña</label>
                    <input type="password" id="login-clave" required>
                </div>
                <p class="form-error oculto" id="error-login"></p>
                <button type="submit" class="btn btn-relleno">Entrar</button>
            </form>
        </div>
    </div>

    <div class="modal-fondo oculto" id="modal-registro">
        <div class="modal">
            <button class="modal-cerrar" data-cerrar="modal-registro">✕</button>
            <h2>Crear cuenta</h2>
            <form id="form-registro">
                <div class="campo">
                    <label for="registro-nombres">Nombres</label>
                    <input type="text" id="registro-nombres" required>
                </div>
                <div class="campo">
                    <label for="registro-apellidos">Apellidos</label>
                    <input type="text" id="registro-apellidos" required>
                </div>
                <div class="campo">
                    <label for="registro-usuario">Nombre de usuario</label>
                    <input type="text" id="registro-usuario" required>
                </div>
                <div class="campo">
                    <label for="registro-correo">Correo</label>
                    <input type="email" id="registro-correo" required>
                </div>
                <div class="campo">
                    <label for="registro-clave">Contraseña</label>
                    <input type="password" id="registro-clave" required minlength="4">
                </div>
                <p class="form-error oculto" id="error-registro"></p>
                <button type="submit" class="btn btn-relleno">Crear cuenta</button>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>EcoHuertos y Asociados</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
